name: Build & Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  SERVICE_NAME: apu-comparativo-mtto
  ARTIFACT_REPO: apu-images

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # necesario para Workload Identity Federation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Autenticación SIN clave JSON (Workload Identity Federation) ---
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # --- Build & Push de la imagen ---
      - name: Build and Push image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${ARTIFACT_REPO}/${SERVICE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # --- Deploy a Cloud Run ---
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --region "${{ secrets.GCP_REGION }}" \
            --service-account "apu-comparativo-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --memory 2Gi --cpu 2 --timeout 900 \
            --max-instances 1 --min-instances 0 --no-cpu-throttling \
            --no-allow-unauthenticated \
            --set-env-vars "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "GCP_REGION=${{ secrets.GCP_REGION }}" \
            --set-env-vars "GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}" \
            --set-env-vars "GCS_INPUT_PREFIX=comparativos/" \
            --set-env-vars "GCS_OUTPUT_PREFIX=reportes/" \
            --set-env-vars "GCS_CONSOLIDADO_PREFIX=consolidado/" \
            --set-env-vars "CONSOLIDADO_WEIGHT=0.9" \
            --set-env-vars "MAX_PRICE_RATIO=3" \
            --set-env-vars "WAREHOUSE_SHEET_URL=${{ secrets.WAREHOUSE_SHEET_URL }}" \
            --set-env-vars "WAREHOUSE_TAB=PRIMARIOS" \
            --set-env-vars "WAREHOUSE_HEADER_ROW=2" \
            --set-env-vars "WH_COL_PRECIO=Precio de Lista" \
            --set-env-vars "^@^WH_CLASIF_INCLUIR=Activa,Duplicado" \
            --set-env-vars "WRITE_PRICE_COL=O" \
            --set-env-vars "WRITE_YEAR_COL=P" \
            --set-env-vars "IPC_VARIATION=${{ secrets.IPC_VARIATION }}" \
            --set-env-vars "APPLY_IPC_TO_WAREHOUSE=true" \
            --set-env-vars "APPLY_IPC_TO_COMPARATIVOS=false" \
            --set-env-vars "FUZZY_THRESHOLD=77" \
            --set-env-vars "USE_EMBEDDINGS=false" \
            --set-env-vars "USE_GEMINI=false" \
            --set-env-vars "GEMINI_MODEL=gemini-2.5-flash" \
            --set-env-vars "GEMINI_LOCATION=us-central1" \
            --set-env-vars "USE_GEMINI_PRICE_RESEARCH=true" \
            --set-env-vars "GEMINI_ARBITRATE_SUSPICIOUS=true" \
            --set-env-vars "GEMINI_PRICE_MAX_ITEMS=0" \
            --set-env-vars "GEMINI_PRICE_MIN_CONFIDENCE=60" \
            --set-env-vars "SUSPICIOUS_PCT_THRESHOLD=50" \
            --set-env-vars "GEMINI_RESOLVE_LINKS=true" \
            --set-env-vars "DRY_RUN=false" \
            --set-env-vars "GEMINI_MIN_INTERVAL_SEC=0.5" \
            --set-env-vars "IVA_PCT=19" 