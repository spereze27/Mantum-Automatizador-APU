name: Build & Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN: 'true' = NO escribe en el Sheet, solo genera el reporte"
        type: choice
        options: ["true", "false"]
        default: "true"
      min_instances:
        description: "min-instances (poner 1 durante corridas largas de Gemini)"
        type: choice
        options: ["0", "1"]
        default: "0"
      gemini_price_max_items:
        description: "Tope de items a consultar en Gemini (0 = sin tope)"
        type: string
        default: "0"

env:
  SERVICE_NAME: apu-comparativo-mtto
  ARTIFACT_REPO: apu-images
  # SEGURO POR DEFECTO. Precedencia:
  #   1) input del workflow_dispatch (corrida manual)
  #   2) variable de repo vars.DRY_RUN (Settings > Variables)
  #   3) 'true'
  # Un `git push` a main NUNCA habilita la escritura por accidente. La escritura
  # pisa las columnas O y P del Sheet vivo y el servicio NO puede deshacerla.
  DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
  MIN_INSTANCES: ${{ github.event.inputs.min_instances || '0' }}
  GEMINI_PRICE_MAX_ITEMS: ${{ github.event.inputs.gemini_price_max_items || '0' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # necesario para Workload Identity Federation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Aviso explícito de si esta corrida escribe o no en el Sheet ---
      - name: Modo de escritura
        run: |
          if [ "${DRY_RUN}" = "false" ]; then
            echo "::warning title=ESCRITURA HABILITADA::DRY_RUN=false. Este deploy ESCRIBE en las columnas O y P del warehouse. Confirma que ya revisaste el reporte de la corrida en seco."
          else
            echo "::notice title=Corrida en seco::DRY_RUN=true. Se genera el reporte en GCS pero NO se escribe en el Sheet."
          fi

      # --- Autenticación SIN clave JSON (Workload Identity Federation) ---
      - name: Auth to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # --- Tests: no se despliega código que no pasa la suite ---
      # Los 58 tests cubren justamente las guardas que impiden repetir los errores
      # del reporte 20260710 (banda infranqueable, arbitraje vinculante,
      # normalización de unidad). Desplegar sin correrlos deja el Sheet expuesto.
      - name: Tests
        run: |
          pip install --quiet pytest pandas numpy openpyxl thefuzz python-Levenshtein PyYAML
          python -m pytest tests/ -q

      # --- Build & Push de la imagen ---
      - name: Build and Push image
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${ARTIFACT_REPO}/${SERVICE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # --- Deploy a Cloud Run ---
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --region "${{ secrets.GCP_REGION }}" \
            --service-account "apu-comparativo-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --memory 2Gi --cpu 2 --timeout 900 \
            --max-instances 1 --min-instances "${MIN_INSTANCES}" --no-cpu-throttling \
            --no-allow-unauthenticated \
            --set-env-vars "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "GCP_REGION=${{ secrets.GCP_REGION }}" \
            --set-env-vars "GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}" \
            --set-env-vars "GCS_INPUT_PREFIX=comparativos/" \
            --set-env-vars "GCS_OUTPUT_PREFIX=reportes/" \
            --set-env-vars "GCS_CONSOLIDADO_PREFIX=consolidado/" \
            --set-env-vars "CONSOLIDADO_WEIGHT=0.9" \
            --set-env-vars "MAX_PRICE_RATIO=3" \
            --set-env-vars "WAREHOUSE_SHEET_URL=${{ secrets.WAREHOUSE_SHEET_URL }}" \
            --set-env-vars "WAREHOUSE_TAB=PRIMARIOS" \
            --set-env-vars "WAREHOUSE_HEADER_ROW=2" \
            --set-env-vars "WH_COL_PRECIO=Precio de Lista" \
            --set-env-vars "^@^WH_CLASIF_INCLUIR=Activa,Duplicado" \
            --set-env-vars "WRITE_PRICE_COL=O" \
            --set-env-vars "WRITE_YEAR_COL=P" \
            --set-env-vars "IPC_VARIATION=${{ secrets.IPC_VARIATION }}" \
            --set-env-vars "APPLY_IPC_TO_WAREHOUSE=true" \
            --set-env-vars "APPLY_IPC_TO_COMPARATIVOS=false" \
            --set-env-vars "FUZZY_THRESHOLD=77" \
            --set-env-vars "USE_EMBEDDINGS=false" \
            --set-env-vars "REF_ESTIMATOR=p75" \
            --set-env-vars "REF_QUANTILE=0.75" \
            --set-env-vars "REF_WINSOR_PCT=5" \
            --set-env-vars "REF_RECENCY_HALFLIFE_DAYS=365" \
            --set-env-vars "REF_WEIGHT_BY_QTY=false" \
            --set-env-vars "ENFORCE_BAND=true" \
            --set-env-vars "AUTO_APPLY_WITHIN_BAND=true" \
            --set-env-vars "SUSPICIOUS_PCT_THRESHOLD=50" \
            --set-env-vars "ARBITRATE_TAKE_MIN=true" \
            --set-env-vars "NORMALIZE_PRESENTATION=true" \
            --set-env-vars "SKIP_NON_DIMENSIONAL_UNITS=true" \
            --set-env-vars "UNIT_PLAUSIBILITY=true" \
            --set-env-vars "PLAUSIBILIDAD_CONFIG_PATH=config/plausibilidad.yaml" \
            --set-env-vars "USE_GEMINI=false" \
            --set-env-vars "GEMINI_MODEL=gemini-2.5-flash" \
            --set-env-vars "GEMINI_LOCATION=us-central1" \
            --set-env-vars "USE_GEMINI_PRICE_RESEARCH=true" \
            --set-env-vars "GEMINI_ARBITRATE_SUSPICIOUS=true" \
            --set-env-vars "GEMINI_PRICE_MAX_ITEMS=${GEMINI_PRICE_MAX_ITEMS}" \
            --set-env-vars "GEMINI_PRICE_MIN_CONFIDENCE=60" \
            --set-env-vars "GEMINI_MIN_INTERVAL_SEC=0.5" \
            --set-env-vars "GEMINI_RESOLVE_LINKS=true" \
            --set-env-vars "GEMINI_REQUIRE_LINK=true" \
            --set-env-vars "IVA_PCT=19" \
            --set-env-vars "DRY_RUN=${DRY_RUN}"

      - name: Resumen
        run: |
          echo "Servicio:  ${SERVICE_NAME}"
          echo "DRY_RUN=${DRY_RUN}   (true = NO escribe en el Sheet)"
          echo "GEMINI_PRICE_MAX_ITEMS=${GEMINI_PRICE_MAX_ITEMS}   MIN_INSTANCES=${MIN_INSTANCES}"
          echo "El reporte queda en gs://${{ secrets.GCS_BUCKET_NAME }}/reportes/"